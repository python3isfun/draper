[project]
name = "drama-agent"
version = "0.1.0"
description = "Three-episode short drama agent: turns a creative seed into scripts, text storyboards and art asset requirements."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "uvicorn>=0.30",
]

[project.scripts]
drama-worker = "drama_agent.worker:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drama_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real MCPHub API (run with RUN_LIVE=1)"]

[tool.ruff]
line-length = 100
target-version = "py311"
